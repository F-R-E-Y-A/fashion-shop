# Gan nguoi duyet theo .github/CODEOWNERS.
#
# Vi sao can workflow nay: kho RIENG TU tren goi GitHub Free khong tu gan nguoi duyet theo CODEOWNERS,
# do la tinh nang tra phi. Khong co no thi tep CODEOWNERS chi la mot to giay dan tuong.
# Khi nhom len goi tra phi, hoac neu doi kho sang cong khai, thi xoa workflow nay di.
name: Gan nguoi duyet theo CODEOWNERS

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target lay ma o nhanh dich; CODEOWNERS phai la ban da duoc duyet, khong phai
          # ban trong pull request, de khong ai tu sua CODEOWNERS roi tu duyet chinh minh.
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lay danh sach tep da doi
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'list<<EOF'
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Gan nguoi duyet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FILES: ${{ steps.files.outputs.list }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/github/request-reviewers.mjs
