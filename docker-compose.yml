# Moi truong phat trien tren may: co so du lieu, Mailpit cho email xac thuc (tu PH3.1) va Redis
# cho gioi han toc do dang nhap/OTP (tu PH3.4).
# Khong dinh nghia san Meilisearch, MinIO hay dich vu khac. Phan he nao can dich vu gi thi
# them o tuan cua phan he do, trong cung pull request (docs/LOG.md#adr-004, docs/features/platform/README.md).
# Chay ca he thong nhu tren may that: infra/compose.prod.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: fashion-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion}
      POSTGRES_DB: ${POSTGRES_DB:-fashion_shop}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fashion} -d ${POSTGRES_DB:-fashion_shop}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Hop thu SMTP gia lap cho local: may chu gui OTP toi day thay vi email that.
  # SMTP_HOST/SMTP_PORT trong .env tro vao day. Xem hop thu tai http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: fashion-shop-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP: may chu API gui OTP vao day
      - '${MAILPIT_UI_PORT:-8025}:8025' # Web UI: xem email da gui

  # Bo dem gioi han toc do (rate limit). Chi giu trang thai tam thoi nen KHONG bat persistence:
  # mat du lieu khi khoi dong lai chi lam cua so dem bat dau lai. Cong host cau hinh duoc bang
  # REDIS_PORT vi may co the da co Redis cua du an khac giu cong 6379; REDIS_URL trong .env phai
  # dung cung cong do (vd REDIS_PORT=6380 thi REDIS_URL=redis://localhost:6380).
  redis:
    image: redis:7-alpine
    container_name: fashion-shop-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
