# render.yaml — Blueprint moi truong thu TAM THOI (S1–S2) cho may chu API. Chuyen sang Azure o S3.
# Cach dung, bien can dien va cach noi voi GitHub Actions: docs/features/platform/staging.md.
# CI xanh tren develop se kich hoat deploy hook qua cd-staging.yml. Khong bat auto-deploy
# tren Render de tranh hai luot deploy cho cung mot commit.
services:
  - type: web
    name: fashion-shop-api
    runtime: docker
    region: singapore
    plan: free
    branch: develop
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: staging
      - key: APP_VERSION
        value: 0.2.0-staging
      # Seed chi nap danh muc/bang tra cuu, khong nap san pham. Du lieu san pham can import rieng.
      - key: SEED_ON_START
        value: 'true'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: RATE_LIMIT_PEPPER
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fashion-shop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fashion-shop-redis
          type: keyvalue
          property: connectionString
      # Render Free chan SMTP ports 25/465/587. Chon nha cung cap ho tro cong khac.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_FROM
        sync: false
      # Dia chi web tren Vercel, dien trong dashboard sau khi tao du an Vercel.
      - key: CORS_ORIGINS
        sync: false

  # Bo dem rate limit/OTP dung chung. Free Key Value khong luu du lieu qua lan restart.
  - type: keyvalue
    name: fashion-shop-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  - name: fashion-shop-db
    region: singapore
    plan: free
    databaseName: fashion_shop
    user: fashion
    postgresMajorVersion: '17'
