# Cau hinh nginx cho giao dien dung tinh (chi dung trong image Docker, khong dung tren Vercel).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Tep co bam trong ten thi khong bao gio doi noi dung: cho trinh duyet giu lau.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Ung dung mot trang: moi duong dan khong phai tep deu tra ve index.html de React Router xu ly.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
